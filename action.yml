name: Rails test
description: Run Rails tests

inputs:
  token:
    description: Github personal access token (PAT) to clone other private repos
    required: false

  setup:
    description: Setup command to run before tests
    required: false
    default: echo

  command:
    description: Command to run tests
    required: false
    default: bundle exec rails test --verbose

  timeout:
    description: Timeout for test execution in seconds (default 1800 = 30 minutes)
    required: false
    default: "1800"

runs:
  using: docker
  # https://pkgs.alpinelinux.org/packages?name=ruby&branch=v3.22&arch=x86_64
  image: docker://voormedia/ruby-build:3.22

  env:
    RAILS_ENV: test
    DISABLE_SPRING: 1

  args:
    - ${{ inputs.setup }}

    - ssh-keyscan -H github.com > /etc/ssh/ssh_known_hosts
    - git config --global url."https://oauth2:${{ inputs.token }}@github.com/".insteadOf "git@github.com:"

    # Install dependencies.
    - bundle config --global silence_root_warning true
    - bundle install --jobs 8 --retry 3

    # Run rubocop if configured.
    # TODO: Extract into separate action? If so, make sure we need to run bundle only once!
    - if [ -f ".rubocop.yml" ]; then bundle exec rubocop; fi

    # Create test database.
    - bundle exec rails db:create

    # Load db structure from SQL or Ruby file.
    - if [ -f "config/sequel.rb" ]; then bundle exec rails db:structure:load; else bundle exec rails db:schema:load; fi

    # Show test files and configuration for debugging
    - echo "=== Test files found ==="
    - find test -name "*.rb" | head -20 || echo "No test directory found"
    - echo "=== Rails test configuration ==="
    - bundle exec rails test --help | head -20 || echo "Could not get test help"
    - echo "=== Starting tests with command: ${{ inputs.command }} ==="
    - echo "=== Test environment check ==="
    - bundle exec rails runner "puts 'Rails app loaded successfully'"

    # Run tests with timeout and additional debugging
    - echo "=== About to run tests ==="
    - timeout ${{ inputs.timeout }} bash -c "echo 'Test command starting...' && ${{ inputs.command }}"
